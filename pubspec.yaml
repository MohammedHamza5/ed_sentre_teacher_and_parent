name: ed_sentre_techer_and_parent
description: "EdSentre - Teacher & Parent Mobile App for Educational Center Management"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # UI & Responsive
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  flutter_animate: ^4.5.0

  # Local Storage
  shared_preferences: ^2.3.4
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.20.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  permission_handler: ^11.3.1

  # QR Code (for attendance)
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.5

  # PDF Viewer
  syncfusion_flutter_pdfviewer: ^28.2.6

  # Networking
  connectivity_plus: ^6.1.1
  http: ^1.2.2
  share_plus: ^10.1.4

  # Others
  flutter_local_notifications: ^18.0.1
  timeago: ^3.7.0
  fl_chart: ^1.1.1
  syncfusion_flutter_pdf: ^28.2.12

dependency_overrides:
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Custom fonts - uncomment after adding font files to assets/fonts/
  # fonts:
