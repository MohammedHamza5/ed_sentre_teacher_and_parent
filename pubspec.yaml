name: ed_sentre_techer_and_parent
description: "EdSentre - Teacher & Parent Mobile App for Educational Center Management"
publish_to: "none"

version: 1.0.1+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # UI & Responsive
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  flutter_animate: ^4.5.2

  # Local Storage
  shared_preferences: ^2.3.4
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.20.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  file_picker: ^10.3.10
  permission_handler: ^11.3.1
  package_info_plus: ^8.3.1
  device_info_plus: ^11.2.0
  open_file: ^3.5.10
  http: ^1.2.2
  crypto: ^3.0.3

  # QR Code (for attendance)
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # PDF Viewer & Generator
  syncfusion_flutter_pdfviewer: ^28.2.6
  pdf: ^3.11.3
  printing: ^5.14.2

  # Networking
  connectivity_plus: ^6.1.1
  share_plus: ^10.1.4

  # Others
  flutter_local_notifications: ^18.0.1
  timeago: ^3.7.0
  fl_chart: ^1.1.1
  syncfusion_flutter_pdf: ^28.2.12
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  google_fonts: ^6.3.2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  infinite_scroll_pagination: ^5.1.1
  encrypt: ^5.0.3
  flutter_secure_storage: ^10.3.1
  uuid: ^4.6.0
  shorebird_code_push: ^2.0.7

dependency_overrides:
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  freezed: ^3.0.0-0.0.dev
  json_serializable: ^6.9.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - shorebird.yaml

  # Custom fonts - uncomment after adding font files to assets/fonts/
  # fonts:
